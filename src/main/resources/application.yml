spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartqueue}
    username: ${DB_USERNAME:smartqueue}
    password: ${DB_PASSWORD:smartqueue}
  jpa:
    hibernate: { ddl-auto: validate }
    open-in-view: false
    properties: { hibernate.jdbc.time_zone: UTC }
  flyway: { enabled: true }
