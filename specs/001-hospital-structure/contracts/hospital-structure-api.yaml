openapi: 3.0.3
info: { title: Hospital Structure API, version: 1.0.0 }
paths:
  /api/v1/hospitals:
    get: { summary: List hospitals, responses: { '200': { description: List } } }
    post: { summary: Create hospital, responses: { '201': { description: Created }, '400': { description: Invalid }, '409': { description: Duplicate } } }
  /api/v1/hospitals/{hospitalId}/branches:
    get: { summary: List hospital branches, responses: { '200': { description: List }, '404': { description: Safe not found } } }
    post: { summary: Create branch, responses: { '201': { description: Created }, '409': { description: Duplicate } } }
  /api/v1/hospitals/{hospitalId}/branches/{branchId}/departments:
    get: { summary: List branch departments, responses: { '200': { description: List }, '404': { description: Safe not found } } }
    post: { summary: Create department, responses: { '201': { description: Created }, '409': { description: Duplicate } } }
  /api/v1/hospitals/{hospitalId}/doctors:
    get: { summary: List hospital doctors, responses: { '200': { description: List } } }
    post: { summary: Register doctor, responses: { '201': { description: Created }, '400': { description: Invalid membership }, '409': { description: Duplicate } } }
  /api/v1/hospitals/{hospitalId}/departments/{departmentId}/doctors:
    get: { summary: List department doctors, responses: { '200': { description: List }, '404': { description: Safe not found } } }
  /api/v1/hospitals/{hospitalId}/doctors/{doctorId}/status:
    patch: { summary: Set doctor active or inactive, responses: { '200': { description: Updated }, '404': { description: Safe not found } } }
components:
  schemas:
    ApiError:
      type: object
      required: [timestamp, status, code, message, path]
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        code: { type: string }
        message: { type: string }
        path: { type: string }
    HospitalRequest:
      type: object
      required: [name]
      properties: { name: { type: string, maxLength: 200 } }
    HospitalResponse:
      type: object
      required: [id, name]
      properties: { id: { type: string, format: uuid }, name: { type: string } }
    BranchRequest:
      type: object
      required: [name]
      properties: { name: { type: string, maxLength: 200 } }
    BranchResponse:
      type: object
      required: [id, hospitalId, name]
      properties: { id: { type: string, format: uuid }, hospitalId: { type: string, format: uuid }, name: { type: string } }
    DepartmentRequest:
      type: object
      required: [name]
      properties: { name: { type: string, maxLength: 200 } }
    DepartmentResponse:
      type: object
      required: [id, branchId, name]
      properties: { id: { type: string, format: uuid }, branchId: { type: string, format: uuid }, name: { type: string } }
    DoctorRequest:
      type: object
      required: [doctorCode, name, specialization, professionalRegistrationNumber, departmentIds]
      properties:
        doctorCode: { type: string, maxLength: 80 }
        name: { type: string, maxLength: 200 }
        specialization: { type: string, maxLength: 200 }
        professionalRegistrationNumber: { type: string, maxLength: 120 }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        departmentIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
    DoctorResponse:
      type: object
      required: [id, hospitalId, doctorCode, name, specialization, professionalRegistrationNumber, status, departmentIds]
      properties:
        id: { type: string, format: uuid }
        hospitalId: { type: string, format: uuid }
        doctorCode: { type: string }
        name: { type: string }
        specialization: { type: string }
        professionalRegistrationNumber: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        departmentIds: { type: array, items: { type: string, format: uuid } }
    DoctorStatusRequest:
      type: object
      required: [status]
      properties: { status: { type: string, enum: [ACTIVE, INACTIVE] } }
